name: Build OpenAPI Spec
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/openapi.yml"
      - "src/endpoints/openapi.tsx"
      - "src/limits.ts"
      - "src/enums.ts"
      - "src/types.ts"
      - "src/appInfo.ts"
      - "package.json"
      - "src/validation/**"
      - "bin/openapi.ts"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  deployments: write

jobs:
  build_spec_main:
    uses: socksthewolf/workflows/.github/workflows/build_openapi.yml@main
    secrets: inherit
    with:
      ref: ${{ github.ref }}
      needs_node: true
      clean_deploys: true

  build_spec_alt:
    uses: socksthewolf/workflows/.github/workflows/build_openapi.yml@main
    secrets: inherit
    with:
      ref: ${{ github.ref }}
      needs_node: true
      clean_deploys: true
      zone_id: ${{ vars.CLOUDFLARE_ALT_ZONE }}
