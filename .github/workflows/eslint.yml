name: ESLint
on:
  push:
    branches: [ "main" ]
    paths:
      - "assets/js/*.js"
      - "src/**"
      - "bin/configs/siteDepsExports.ts"
      - ".github/workflows/eslint.yml"
      - "eslint.config.ts"
      - ".node-version"
      - "package.json"
      - "wrangler.toml"
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
    paths:
      - "assets/js/*.js"
      - "src/**"
      - "bin/configs/siteDepsExports.ts"
      - "eslint.config.ts"
      - "wrangler.toml"
      - "package.json"

permissions:
  contents: read
  security-events: write

jobs:
  run:
    name: Scan
    uses: socksthewolf/workflows/.github/workflows/run_eslint.yml@main
    with:
      ref: ${{ github.ref }}