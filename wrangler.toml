"$schema" = "./node_modules/wrangler/config-schema.json"
name = "skyscheduler"
main = "src/index.tsx"
compatibility_date = "2025-11-18"
compatibility_flags = [
  "nodejs_compat",
  "nodejs_compat_do_not_populate_process_env",
  "disable_ctx_exports",
  "disable_nodejs_http_server_modules"
]
send_metrics = false
minify = true
upload_source_maps = true
preview_urls = false

assets = { binding = "ASSETS", run_worker_first = false, directory = "./assets/", not_found_handling = "single-page-application" }
routes = [
  { pattern = "skyscheduler.work", custom_domain = true }
]

[build]
command = "npm run build"

# Activate workers cache. This makes it so we don't have to manually place into the cache
# and gives us the ability to not run the worker at all in some requests.
[cache]
enabled = true

# Redis for sessions
[[kv_namespaces]]
binding = "KV"
id = "0ecd892014ac47eea38c72be94586e7b"

# Invite key pool
[[kv_namespaces]]
binding = "INVITE_POOL"
id = "45e1cff45cad45c28b22c4fbcd30db00"

# Funding table
[[kv_namespaces]]
binding = "FUNDING"
id = "5e8e30e1a13348d9a1eaa4604246bf0a"

[[d1_databases]]
binding = "DB"
database_name = "skyposts"
database_id = "5553e724-4dfb-4771-9c08-3584da5855d1"
migrations_table = "migrations"
migrations_dir = "migrations"

# media storage
[[r2_buckets]]
binding = "R2"
bucket_name = "skyembeds"

# temporary storage to get CF Images working, this bucket should be WAF'd so no one but the worker can access it.
[[r2_buckets]]
binding = "R2RESIZE"
bucket_name = "skyscheduler-resize"

# rate limits to help combat abuse
[[ratelimits]]
name = "REPOST_LIMITER"
namespace_id = "5471001"
simple = { limit = 4, period = 10 }
[[ratelimits]]
name = "POST_LIMITER"
namespace_id = "5471002"
simple = { limit = 10, period = 10 }
[[ratelimits]]
name = "ACCOUNT_UPDATE_LIMITER"
namespace_id = "5471003"
simple = { limit = 7, period = 60 }
[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "5471004"
simple = { limit = 10, period = 60 }
[[ratelimits]]
name = "REPOST_EDIT_LIMITER"
namespace_id = "5471005"
simple = { limit = 5, period = 10 }
[[ratelimits]]
name = "REPOST_EDITOR_OPEN_LIMITER"
namespace_id = "5471006"
simple = { limit = 10, period = 10 }

# Schedule cron triggers for post/repost cadance, anything less than an hour MUST use queues to process properly.
# Additionally @:
#  ~3:37am on sunday for big cleanups
#  the first of every month to reset server fund stats
[triggers]
crons = [ "0 0 1 */1 *", "37 03 * * sun", "*/30 * * * *", "*/15 * * * *" ]

# flags required to run wrangler in linux
[dev]
ip = "127.0.0.1"

[observability]
enabled = true
head_sampling_rate = 1
[observability.traces]
enabled = true
head_sampling_rate = 0.5
persist = true

# Queues for handling posting at schedules
[[queues.producers]]
queue = "skyscheduler-post-queue"
binding = "POST_QUEUE"

[[queues.producers]]
queue = "skyscheduler-post-queue2"
binding = "POST_QUEUE2"

[[queues.producers]]
queue = "skyscheduler-repost-queue"
binding = "REPOST_QUEUE"

[[queues.consumers]]
queue = "skyscheduler-post-queue"
max_batch_size = 2
max_batch_timeout = 0
max_retries = 3

[[queues.consumers]]
queue = "skyscheduler-post-queue2"
max_batch_size = 2
max_batch_timeout = 0
max_retries = 3

[[queues.consumers]]
queue = "skyscheduler-repost-queue"
max_batch_size = 6
max_batch_timeout = 4
max_retries = 3

# Comment this out if you don't have a tail logger
[[tail_consumers]]
service = "taillogger"

# used for resizing the thumbnails for link posts
[images]
binding = "IMAGES"

# enable smart placement
[placement]
mode = "smart"

# this did give us issues in the past...
[limits]
# our current worse case is about 4s on login
cpu_ms = 60000

[secrets]
required=["BETTER_AUTH_SECRET", "DEFAULT_ADMIN_USER", "DEFAULT_ADMIN_PASS", "RESIZE_SECRET_HEADER"]

[vars]
# the domain and protocol that this application is hosted on. note this value is also used for CORS
BETTER_AUTH_URL="https://skyscheduler.work"

# The turnstile captcha public key
TURNSTILE_PUBLIC_KEY="0x4AAAAAABkTE_9TV_bUnLGK"

# the host for CSP reports to go to. if the CSP flags are off, this will not be used.
CSP_REPORT_URL="https://report.skyscheduler.work/csp"

# If we should use cf image transforms &
# how much of a quality percentage should we try and the public location of the resize bucket.
IMAGE_SETTINGS={enabled=true, steps=[95, 85, 75], bucket_url="https://resize.skyscheduler.work/"}

# queue handling, pushing information.
QUEUE_SETTINGS = {enabled=true, postNowEnabled=false, delay_val=100, max_retries=3, post_queues=[
  "POST_QUEUE", "POST_QUEUE2"], repost_queues=["REPOST_QUEUE"]}

# if we should be removing abandoned files from R2 storage
R2_SETTINGS={auto_prune=true, prune_days=3}

# settings about tasks
TASK_SETTINGS={use_posts=true, use_reposts=true}

# set this to true in your .env to turn off turnstile
IN_DEV=false